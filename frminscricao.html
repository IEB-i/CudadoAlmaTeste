        .logo-circle {
            width: 120px;

            background: white;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -30%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .logo-circle img {
            max-width: 150px;
            height: auto;
            margin-top: 15px;
        }

        .logo-circle.scrolled {
            left: 60px;
            transform: translate(0, -30%);
            background: transparent;
            box-shadow: none;
            top: 5px;
        }

        .scrolled .logo-circle img {
            content: url('./assets/Logo\ 360\ sem\ Fundo.png');
            width: 180px;
            height: auto;
            margin-top: -80;
        }

        .header-title {
            color: white;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: none;
        }

        .header-title.visible {
            opacity: 1;
            display: block;
        }


        .divider {
            width: 75%;
            height: 2px;
            background-color: #000;
            margin: 30px auto;
        }

        .btn-primary {
            background: linear-gradient(45deg, #6108a1, #9900CC);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #200020, #9900CC);
        }

        .form-control:focus {
            border-color: #3d7517;
            box-shadow: 0 0 0 0.2rem rgba(128, 0, 128, 0.25);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 24px;
            margin-left: 10px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        .info-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }

        input:checked+.slider {
            background: linear-gradient(45deg, #3d7517, #3d7517);
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }

        @media (max-width: 768px) {
            body {
                padding-top: 120px;
            }

            .container {
                max-width: 97%;
                margin: 10px 5px;
                padding: 15px;
                border-radius: 0;
            }

            .logo-circle.scrolled {
                left: 3px;
                transform: translate(0, -30%);
            }

            .scrolled .logo-circle img {
                width: 96px;
                /* Redução de 20% de 120px */
                height: auto;
            }

            .header-title {
                font-size: 1.3rem;
                text-align: center;
            }

            .header {
                position: fixed;
                top: 0;
                width: 100%;
                z-index: 1000;
            }

        }

        .signature-container {
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            margin-bottom: 10px;
        }

        .signature-pad {
            width: 100%;
            height: 200px;
            touch-action: none;
            cursor: crosshair;
        }

        .signature-buttons {
            display: flex;
            justify-content: flex-end;
        }

    <script>
        // Verificar limite de vagas antes de permitir o preenchimento
        db.collection("Eventos").doc("ComRoca2026").get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                const totalInscricoes = data.totalInscricoes || (data.contador && data.contador.totalInscricoes) || 0;
                if (totalInscricoes >= 150) {
                    alert("As inscrições já foram encerradas. Limite de vagas atingido.");
                    window.location.href = 'index.html';
                }
            }
        });

        // Inicialização do EmailJS - mova para fora do objeto firebaseConfig
        emailjs.init("service_8dce1so");

        // Função para verificar se o nome já existe
        function verificarNomeExistente(nome) {
            return db.collection("Eventos").doc("ComRoca2026").collection("inscricoes")
                .where("nome", "==", nome)
                .where("anoevento", "==", "2026")
                .get()
                .then((querySnapshot) => {
                    return !querySnapshot.empty;
                });
        }

        // Adicionar evento 'blur' ao campo 'nome'
        document.getElementById('nome').addEventListener('blur', function () {
            const nome = this.value.trim().toUpperCase();
            if (nome) {
                verificarNomeExistente(nome).then(existe => {
                    if (existe) {
                        alert('Este nome já está cadastrado.');
                        this.value = ''; // Limpa o campo
                        this.focus(); // Redireciona o cursor para o campo
                        document.getElementById('cadastrarBtn').disabled = true;
                    } else {
                        document.getElementById('cadastrarBtn').disabled = false;
                    }
                });
            }
        });

        // Função para converter texto para maiúsculas
        function toUpperCase(input) {
            input.value = input.value.toUpperCase();
        }

        // Adicionar evento na digitação para campos de texto
        const textInputs = document.querySelectorAll('input[type="text"]');
        textInputs.forEach(input => {
            input.addEventListener('input', function () {
                toUpperCase(this);
            });
        });

        document.getElementById('nome').addEventListener('input', atualizarTextoAutorizacao);
        document.getElementById('contato').addEventListener('input', atualizarTextoAutorizacao);

        // Função para atualizar o texto de autorização com os nomes
        function atualizarTextoAutorizacao() {
            const nomeParticipante = document.getElementById('nome').value.trim();
            const nomeResponsavel = document.getElementById('contato').value.trim();

            document.getElementById('nomeParticipanteSpan').textContent = nomeParticipante;
            document.getElementById('nomeResponsavelSpan').textContent = nomeResponsavel;
        }

        // Máscaras
        // VMasker(document.getElementById("cpf")).maskPattern("999.999.999-99");
        VMasker(document.getElementById("celular")).maskPattern("(99) 99999-9999");
        VMasker(document.getElementById("fonecontato")).maskPattern("(99) 99999-9999");
        VMasker(document.getElementById("cpfResponsavel")).maskPattern("999.999.999-99");
        // VMasker(document.getElementById("cep")).maskPattern("99999-999");

        // Calcular idade automaticamente
        document.getElementById('dtnasc').addEventListener('change', function () {
            const birthDate = new Date(this.value);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            document.getElementById('idade').value = age + " anos";

            // Controlar a exibição dos campos de responsável e autorização
            const responsavelDiv = document.getElementById('responsavelDiv');
            const autorizacaoDiv = document.getElementById('autorizacaoDiv');
            const contatoField = document.getElementById('contato');
            const fonecontatoField = document.getElementById('fonecontato');
            const cpfResponsavelField = document.getElementById('cpfResponsavel');
            const signatureContainer = document.querySelector('.signature-container')?.parentElement;

            if (age < 0) {
                // Mostrar campos e torná-los obrigatórios para menores de 18
                responsavelDiv.style.display = 'block';
                autorizacaoDiv.style.display = 'block';
                if (signatureContainer) signatureContainer.style.display = 'block';

                contatoField.required = true;
                fonecontatoField.required = true;
                cpfResponsavelField.required = true;

                contatoField.parentElement.querySelector('label').innerHTML = 'Nome do Responsável (Obrigatório para menor de 18 anos) *';
                fonecontatoField.parentElement.querySelector('label').innerHTML = 'Celular do Responsável (Obrigatório para menor de 18 anos) *';
                cpfResponsavelField.parentElement.querySelector('label').innerHTML = 'CPF do Responsável (Obrigatório para menor de 18 anos) *';
            } else {
                // Ocultar campos e remover obrigatoriedade para maiores de 18
                responsavelDiv.style.display = 'none';
                autorizacaoDiv.style.display = 'none';
                if (signatureContainer) signatureContainer.style.display = 'none';

                contatoField.required = false;
                fonecontatoField.required = false;
                cpfResponsavelField.required = false;

                // Limpar os valores
                contatoField.value = '';
                fonecontatoField.value = '';
                cpfResponsavelField.value = '';

                // Limpar a assinatura se o pad existir
                if (typeof signaturePad !== 'undefined' && signaturePad) {
                    signaturePad.clear();
                }

                contatoField.parentElement.querySelector('label').innerHTML = 'Nome do Responsável';
                fonecontatoField.parentElement.querySelector('label').innerHTML = 'Celular do Responsável';
                cpfResponsavelField.parentElement.querySelector('label').innerHTML = 'CPF do Responsável';
            }

            // Atualizar o texto de autorização
            atualizarTextoAutorizacao();
        });

        // Mostrar/esconder campo de outra igreja
        document.getElementById('igreja').addEventListener('change', function () {
            document.getElementById('outraIgrejaDiv').style.display =
                this.value === 'Outra' ? 'block' : 'none';
            document.getElementById('celulaDiv').style.display =
                this.value === 'IEB Intermares' ? 'block' : 'none';
        });

            selectCelula.innerHTML = '<option value="">Selecione seu Líder de Célula</option>';

            // Lista estática de líderes de células
            const lideres = [
                "Ainda não tenho Célula",
                "ADRIANA / KENEDY - AGUA VIVA 2",
                "ADVANILTON / EDVÂNIA - AE01",
                "ALDA - A01",

                "RAMON / NAZELIA - FILADÉLFIA",
                "RAQUEL - SHAMMAR",
                "RHODNEY / KAREN - YAHWEH",
                "RIBAMAR / JOSELMA - ALIANÇA",
                "RICARDO / ROSANE - KADOSH",
                "RUBENS / EMILLY - AGUA VIVA 3",

            const outrasCelulasOption = document.createElement('option');

        document.getElementById('celula').addEventListener('change', function () {
            const liderSelecionado = this.value;
            const infoRedeDiv = document.getElementById('infoRedeDiv');

            if (liderSelecionado && liderSelecionado !== "Outras Células") {
                // Como não temos mais as informações de supervisor e rede no Firebase,
                // vamos ocultar esses campos ou deixá-los vazios
                document.getElementById('supervisor').value = '';
                document.getElementById('rede').value = '';
                infoRedeDiv.style.display = 'none';
            } else {
                document.getElementById('supervisor').value = '';
                document.getElementById('rede').value = '';
                infoRedeDiv.style.display = 'none';
            }
        });


        // Chame a função quando a igreja for selecionada
        document.getElementById('igreja').addEventListener('change', function () {
            const celulaDiv = document.getElementById('celulaDiv');
            const outraIgrejaDiv = document.getElementById('outraIgrejaDiv');
            const infoRedeDiv = document.getElementById('infoRedeDiv');

            if (this.value === 'IEB Intermares') {
                celulaDiv.style.display = 'block';
                outraIgrejaDiv.style.display = 'none';
                carregarLideres();
            } else if (this.value === 'Outra') {
                celulaDiv.style.display = 'none';
                outraIgrejaDiv.style.display = 'block';
                infoRedeDiv.style.display = 'none';
                document.getElementById('supervisor').value = '';
                document.getElementById('rede').value = '';
                document.getElementById('celula').value = '';
            } else {
                celulaDiv.style.display = 'none';
                outraIgrejaDiv.style.display = 'none';
                infoRedeDiv.style.display = 'none';
                document.getElementById('supervisor').value = '';
                document.getElementById('rede').value = '';
                document.getElementById('celula').value = '';
            }

        // Adicionar log para verificar quando o script é carregado
        //console.log('Script inicializado');

        // Verificar se o elemento dataPreenchimento existe
        const dataPreenchimentoElement = document.getElementById('dataPreenchimento');
        //console.log('Elemento dataPreenchimento encontrado:', dataPreenchimentoElement);

        // Definir a data de preenchimento e verificar o valor

        //console.log('Data atual formatada:', dataAtual);
        dataPreenchimentoElement.value = dataAtual;
        //console.log('Valor após atribuição:', dataPreenchimentoElement.value);

        // No evento de submit do formulário, adicione esta verificação:
        document.getElementById('acampForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Verificar se os campos de responsável estão visíveis e obrigatórios
            const responsavelDiv = document.getElementById('responsavelDiv');
            if (responsavelDiv.style.display === 'block') {
                const contato = document.getElementById('contato').value.trim();
                const fonecontato = document.getElementById('fonecontato').value.trim();
                const cpfResponsavel = document.getElementById('cpfResponsavel').value.trim();

                if (!contato || !fonecontato || !cpfResponsavel) {
                    alert('Por favor, preencha todos os dados do responsável (obrigatório para menores de 18 anos).');
                    return;
                }

                // Verificar se a assinatura foi feita
                if (signaturePad && signaturePad.isEmpty()) {
                    alert('Por favor, forneça a assinatura do responsável antes de prosseguir.');
                    return;
                }

                // Adicionar log para visualizar a assinatura
                if (signaturePad) {
                    const assinaturaTemp = signaturePad.toDataURL('image/png');
                    console.log('Assinatura capturada:');
                    console.log('Tipo de dados:', typeof assinaturaTemp);
                    console.log('Tamanho da string:', assinaturaTemp.length);
                    console.log('Primeiros 100 caracteres:', assinaturaTemp.substring(0, 100) + '...');

                    // Criar um elemento de imagem para visualizar a assinatura no console
                    const img = new Image();
                    img.src = assinaturaTemp;
                    img.onload = function () {
                        console.log('Dimensões da imagem:', img.width, 'x', img.height);
                    };
                }
            }

            // First check if elements exist before accessing their style property
            const outraIgrejaDiv = document.getElementById('outraIgrejaDiv');
            const quaisAlergiasDiv = document.getElementById('quaisAlergiasDiv');

            // Only check display style if elements exist
            const outraIgrejaVisivel = outraIgrejaDiv ? outraIgrejaDiv.style.display === 'block' : false;
            const quaisAlergiasVisivel = quaisAlergiasDiv ? quaisAlergiasDiv.style.display === 'block' : false;

            // Rest of your validation logic
            if (outraIgrejaVisivel && !document.getElementById('outraIgreja').value.trim()) {
                alert('Por favor, preencha o campo "Qual Igreja?".');
                return;
            }

            if (quaisAlergiasVisivel && !document.getElementById('quaisAlergias').value.trim()) {
                alert('Por favor, preencha o campo "Quais alergias?".');
                return;
            }

            // Verificar novamente se o nome já existe antes de enviar
            const nome = document.getElementById('nome').value.trim().toUpperCase();
            verificarNomeExistente(nome).then(existe => {
                if (existe) {
                    alert('Este nome já está cadastrado. Não é possível prosseguir com o cadastro.');
                    return;
                }

                // Capturar a assinatura se existir
                let assinaturaData = '';
                if (signaturePad && !signaturePad.isEmpty() && responsavelDiv.style.display === 'block') {
                    assinaturaData = signaturePad.toDataURL('image/png');
                    // Log adicional para confirmar a assinatura que será armazenada
                    console.log('Assinatura que será armazenada no Firestore:');
                    console.log('Formato:', assinaturaData.split(',')[0]);
                    console.log('Tamanho total em bytes:', new Blob([assinaturaData]).size);
                }

                // Se o nome não existir, continuar com o envio do formulário
                const formData = {
                    nome: nome,
                    // cpf: document.getElementById('cpf').value,
                    dtnasc: document.getElementById('dtnasc').value,
                    idade: document.getElementById('idade').value,
                    // email: document.getElementById('email').value,
                    celular: document.getElementById('celular').value,
                    contato: document.getElementById('contato').value,
                    fonecontato: document.getElementById('fonecontato').value,
                    cpfResponsavel: document.getElementById('cpfResponsavel').value, // Adicionado campo de CPF do responsável
                    assinaturaResponsavel: assinaturaData, // Adicionando a assinatura do responsável
                    igreja: document.getElementById('igreja').value,
                    celula: document.getElementById('celula').value,
                    supervisor: document.getElementById('supervisor').value,
                    rede: document.getElementById('rede').value,
                    outraIgreja: document.getElementById('outraIgreja').value,
                    dataPreenchimento: document.getElementById('dataPreenchimento').value,
                    anoevento: '2026',
                    statusPagamento: 'pendente',
                    dtRegistro: new Date().toISOString()
                };

                // Log para visualizar o objeto formData completo (sem a assinatura para não sobrecarregar o console)
                console.log('Dados completos a serem enviados:', { ...formData, assinaturaResponsavel: formData.assinaturaResponsavel ? 'ASSINATURA_BASE64_REMOVIDA_DO_LOG' : null });

                db.collection("Eventos").doc("ComRoca2026").collection("inscricoes").add(formData)
                    .then((docRef) => {
                        console.log("Documento escrito com ID: ", docRef.id);

                        // ✅ ADICIONE ESTA PARTE - Incrementar contador
                        return db.collection("Eventos").doc("ComRoca2026").update({
                            totalInscricoes: firebase.firestore.FieldValue.increment(1),
                            ultimaAtualizacao: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    })
                    .then(() => {
                        console.log("Contador atualizado!");

                        // Send email notification
                        const emailData = {
                            to: "[EMAIL_ADDRESS]",
                            subject: "Nova Inscrição Comunhão na Roça 2026",
                            text: `Nova inscrição realizada:\nNome: ${formData.nome}\nTelefone: ${formData.celular}\nData: ${formData.dataPreenchimento}`
                        };

                        // Using EmailJS service
                        emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", emailData, "YOUR_USER_ID")
                            .then(response => console.log("Email enviado:", response))
                            .catch(error => console.error("Erro ao enviar email:", error));

                        window.location.href = 'obrigado.html';
                        this.reset();

                        // Resetar campos adicionais
                        document.getElementById('outraIgrejaDiv').style.display = 'none';
                        document.getElementById('dataPreenchimento').value = new Date().toLocaleDateString('pt-BR');
                        document.getElementById('idade').value = '';

                        // Limpar a assinatura
                        if (signaturePad) {
                            signaturePad.clear();
                        }
                    })
                    .catch((error) => {
                        console.error("Erro ao adicionar documento: ", error);
                        console.log(error); // Adicione esta linha para obter mais detalhes sobre o erro
                        alert('Erro ao realizar inscrição. Por favor, tente novamente.');
                    });
            });
        });

        window.addEventListener('scroll', function () {
            const header = document.querySelector('.header');
            //const logoCircle = document.querySelector('.logo-circle');
            const headerTitle = document.querySelector('.header-title');

            if (window.scrollY > 50) {
                header.classList.add('scrolled');
                //logoCircle.classList.add('scrolled');
                headerTitle.classList.add('visible');
            } else {
                header.classList.remove('scrolled');
                //logoCircle.classList.remove('scrolled');
                headerTitle.classList.remove('visible');
            }
        });

        // Inicializar o pad de assinatura
        let signaturePad;

        document.addEventListener('DOMContentLoaded', function () {
            const canvas = document.getElementById('signature-pad');
            if (canvas) {
                // Configurar o canvas para o tamanho correto antes de inicializar o SignaturePad
                const ratio = Math.max(window.devicePixelRatio || 1, 1);
                canvas.width = canvas.offsetWidth * ratio;
                canvas.height = canvas.offsetHeight * ratio;
                const ctx = canvas.getContext("2d");
                ctx.scale(ratio, ratio);

                // Inicializar o SignaturePad com configurações adicionais
                signaturePad = new SignaturePad(canvas, {
                    backgroundColor: 'rgb(255, 255, 255)',
                    penColor: 'rgb(0, 0, 0)',
                    velocityFilterWeight: 0.7,  // Suaviza a linha
                    minWidth: 0.5,              // Largura mínima da linha
                    maxWidth: 2.5,              // Largura máxima da linha
                    throttle: 16,               // Intervalo mínimo entre pontos (ms)
                    minDistance: 5              // Distância mínima entre pontos
                });

                // Função para redimensionar o canvas
                function resizeCanvas() {
                    // Salvar a assinatura atual
                    const data = signaturePad.toData();

                    // Redimensionar o canvas
                    const ratio = Math.max(window.devicePixelRatio || 1, 1);
                    canvas.width = canvas.offsetWidth * ratio;
                    canvas.height = canvas.offsetHeight * ratio;
                    ctx.scale(ratio, ratio);

                    // Limpar e restaurar a assinatura
                    signaturePad.clear();
                    if (data && data.length > 0) {
                        signaturePad.fromData(data);
                    }
                }

                // Adicionar evento de redimensionamento
                window.addEventListener("resize", resizeCanvas);

                // Adicionar eventos de mouse explicitamente
                canvas.addEventListener('mousedown', function (event) {
                    console.log('Mouse down event detected');
                });

                // Botão para limpar a assinatura
                document.getElementById('clear-signature').addEventListener('click', function () {
                    signaturePad.clear();
                    console.log('Assinatura limpa');
                });

                // Log para confirmar inicialização
                console.log('SignaturePad inicializado com sucesso');
            } else {
                console.error('Canvas para assinatura não encontrado');
            }
        });


    </script>
</body>
