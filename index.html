<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSCRIÇÕES</title>
    <link rel="shortcut icon" href="./assets/3.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="./firebase/firebaseConfig.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f4ebda;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Montserrat', sans-serif;
        }

        .banner-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .btn-hidden {
            display: none !important;
        }

        .btn-gradient {
            background: linear-gradient(to right, #663800, #FF8C00);
            color: white;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            text-transform: uppercase;
            border: none;
            box-shadow: 0 4px 15px rgba(58, 16, 86, 0.4);
            transition: all 0.3s ease;
            position: absolute;
            top: 73%;
            left: 58%;
            transform: translateX(-50%);
            text-decoration: none;
            min-width: 200px;
            text-align: center;
            animation: subtle-glow 3s ease-in-out infinite;
            z-index: 10;
        }

        .btn-gradient:hover {
            background: linear-gradient(to right, #FF8C00, #663800);
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 8px 25px rgba(58, 16, 86, 0.6);
            color: white;
            text-decoration: none;
            animation: none;
        }



        .alerta-esgotado {
            position: absolute;
            top: 71.5%;
            left: 59%;
            transform: translateX(-50%);
            background-color: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            max-width: 400px;
            z-index: 15;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Efeito glow profissional */
        @keyframes subtle-glow {

            0%,
            100% {
                box-shadow: 0 4px 15px rgba(58, 16, 86, 0.4);
            }

            50% {
                box-shadow: 0 4px 20px rgba(255, 140, 0, 0.6), 0 0 30px rgba(255, 140, 0, 0.3);
            }
        }

        .desktop-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        .mobile-image {
            display: none;
        }

        .admin-login-btn {
            position: fixed;
            top: 15px;
            right: 20px;
            color: #613704;
            font-size: 28px;
            z-index: 1000;
            transition: all 0.3s ease;
            text-decoration: none;
            opacity: 0.75;
        }

        .admin-login-btn:hover {
            color: #8A4B08;
            opacity: 1;
            transform: rotate(90deg);
        }

        .loading-spinner {
            position: absolute;
            top: 76.5%;
            left: 57%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(102, 56, 0, 0.2);
            border-top: 4px solid #FF8C00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .loading-text {
            margin-top: 10px;
            color: #613704;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media screen and (max-width: 768px) {
            .banner-wrapper {
                width: 100vw;
                height: 100vh;
                max-width: 100vw;
                max-height: 100vh;
                aspect-ratio: auto;
            }

            .mobile-image {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                margin: 0;
                padding: 0;
            }

            .desktop-image {
                display: none;
            }

            .btn-gradient {
                padding: 12px 30px;
                font-size: 16px;
                min-width: 250px;
                top: 60%;
                left: 51.5%;
                position: absolute;
            }

            .alerta-esgotado {
                position: absolute;
                top: 68.1%;
                left: 52%;
                width: 50%;
                min-width: 290px;
                max-width: 340px;
                font-size: 14px;
                padding: 14px 30px;
            }

            .loading-spinner {
                position: absolute;
                top: 71.5%;
                left: 50.5%;
            }

            .loading-text {
                margin-top: 8px;
                color: #613704;
                text-shadow: none;
            }
        }
    </style>
</head>

<body>
    <a href="login.html" class="admin-login-btn" title="Acesso Administrativo">
        <i class="bi bi-gear-fill"></i>
    </a>

    <div class="banner-wrapper">
        <img src="./assets/Texto.png" alt="Workshop Cuidado da Alma" class="desktop-image">
        <img src="./assets/Texto Celular.png" alt="Workshop Cuidado da Alma" class="mobile-image">

        <a href="frminscricao.html" class="btn-gradient btn-hidden" id="btnInscricao">
            Inscreva-se Agora
        </a>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <div class="loading-text">Verificando vagas disponíveis...</div>
        </div>

        <div class="alerta-esgotado" id="alertaEsgotado" style="display: none;">
            <div>🚫 <strong>Inscrições Encerradas!</strong></div>
            <div style="font-size: 14px; margin-top: 5px;">Limite de vagas atingido</div>
        </div>
    </div>

    <script>
        // ✅ SOLUÇÃO: Ler apenas 1 documento contador
        function verificarLimiteInscricoes() {
            if (typeof db === 'undefined') {
                console.error('Firebase não foi inicializado corretamente');
                return;
            }

            const loadingSpinner = document.getElementById('loadingSpinner');
            loadingSpinner.style.display = 'block';

            // ✅ LER APENAS 1 DOCUMENTO = 1 LEITURA
            db.collection("Eventos").doc("Conf2026")  // Acesse diretamente o documento Conf2026
                .get()  // Aqui você já faz a leitura do documento
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        const totalInscricoes = data.totalInscricoes || (data.contador && data.contador.totalInscricoes) || 0;
                        console.log(`Total de inscrições Conf: ${totalInscricoes}`);

                        const btnInscricao = document.getElementById('btnInscricao');
                        const alertaEsgotado = document.getElementById('alertaEsgotado');

                        loadingSpinner.style.display = 'none';
                        btnInscricao.classList.remove('btn-hidden');

                        if (totalInscricoes >= 150) {
                            // Inscrições encerradas: Ocultar o botão e exibir o alerta
                            btnInscricao.classList.add('btn-hidden');
                            alertaEsgotado.style.display = 'block';
                        } else {
                            // Inscrições abertas: Exibir o botão e ocultar o alerta
                            btnInscricao.classList.remove('btn-hidden');
                            alertaEsgotado.style.display = 'none';
                        }
                    } else {
                        console.log("Documento Conf2026 não existe");
                        // Fallback: assumir 0 inscrições
                        handleButtonState(0);
                    }
                })
                .catch((error) => {
                    console.error("Erro ao verificar contador:", error);
                    // Em caso de erro, mostrar o botão funcionando
                    handleErrorState();
                });


        }

        // Verificar limite quando a página carregar
        document.addEventListener('DOMContentLoaded', function () {
            // Aguardar um pouco para garantir que o Firebase foi inicializado
            setTimeout(verificarLimiteInscricoes, 1000);
        });

        // Verificar limite periodicamente (a cada 30 segundos)
        setInterval(verificarLimiteInscricoes, 30000);
    </script>
</body>

</html>
